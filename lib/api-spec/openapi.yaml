          description: Ended, unsettled rankings with three or more failed closeout attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCloseoutAlertsResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
  /admin/stripe-webhook-health:
    get:
      tags: [admin]
      operationId: getAdminStripeWebhookHealth
      summary: Review the exact managed Stripe endpoint and recent signed delivery evidence
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Informational health evidence; never changes paid-play launch controls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStripeWebhookHealth"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
  /admin/users/search:
    get:
      tags: [admin]
      operationId: searchAdminUsers
      summary: Search users by email, ID, or name
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Matching users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserSearchResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
  /admin/users/{id}:
    get:
      tags: [admin]
      operationId: getAdminUser
      summary: Inspect a user's wallet and challenge history
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: User support detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
        "404":
          description: User not found.
  /admin/challenges/{challengeId}/participants/{userId}/override:
    post:
      tags: [admin]
      operationId: overrideAdminChallengeParticipant
      summary: Override a free challenge participant status
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminParticipantOverrideBody"
      responses:
        "200":
          description: Participant status override recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminParticipantOverrideResponse"
        "400":
          description: Invalid override or paid challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
        "404":
          description: Challenge or participant not found.
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema:
        type: string
    ChallengeId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    Challenge:
      type: object
      required: [id, name, theme, level, startDate, endDate, days, dailyGoal, entryFee, prizePool, participantCount, finishers, color, challengeType, goalType, community, visibility, settlementStatus, joined, createdByCurrentUser]
      properties:
        id: { type: string }
        name: { type: string }
        theme: { type: string }
        level: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        days: { type: integer }
        dailyGoal: { type: integer }
        entryFee: { type: number }
        prizePool: { type: number }
        participantCount: { type: integer }
        finishers: { type: integer }
        color: { type: string }
        challengeType: { type: string, enum: [goal, elimination, ranking] }
        goalType: { type: string }
        community: { type: boolean }
        visibility: { type: string, enum: [public, private_group] }
        settlementStatus: { type: string, enum: [open, pending_review, settled] }
        joined: { type: boolean }
        createdByCurrentUser: { type: boolean }
    Activity:
      type: object
      required: [id, type, title, meta, timestamp]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        meta: { type: string }
        timestamp: { type: string }
    WalletSummary:
      type: object
      required: [balance, pending, totalEarned]
      properties:
        balance: { type: number }
        pending: { type: number }
        totalEarned: { type: number }
    ProfileSettings:
      type: object
      required: [displayName, reminders, weeklyDigest, publicProgress, healthConnected, goalBaseline, eligibilityAge, eligibilityState, identityStatus, acceptedTerms, weightLbs, heightInches, fitnessGoals]
      properties:
        displayName: { type: string }
        reminders: { type: boolean }
        weeklyDigest: { type: boolean }
        publicProgress: { type: boolean }
        healthConnected: { type: boolean }
        goalBaseline: { type: integer }
        eligibilityAge: { type: integer, minimum: 0 }
        eligibilityState: { type: string, maxLength: 2 }
        identityStatus: { type: string, enum: [not_started, pending, verified] }
        acceptedTerms: { type: boolean }
        weightLbs: { type: ["number", "null"], minimum: 0, maximum: 2000 }
        heightInches: { type: ["integer", "null"], minimum: 24, maximum: 96 }
        fitnessGoals: { type: string, maxLength: 500 }
    ProfileUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        reminders: { type: boolean }
        weeklyDigest: { type: boolean }
        publicProgress: { type: boolean }
        healthConnected: { type: boolean }
        eligibilityAge: { type: integer, minimum: 0, maximum: 120 }
        eligibilityState: { type: string, maxLength: 2 }
        acceptedTerms: { type: boolean }
        weightLbs: { type: ["number", "null"], minimum: 0, maximum: 2000 }
        heightInches: { type: ["integer", "null"], minimum: 24, maximum: 96 }
        fitnessGoals: { type: string, maxLength: 500 }
    ChallengeChatMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 1000 }
    ChallengeChatMessage:
      type: object
      required: [id, authorName, content, createdAt, isMine]
      properties:
        id: { type: string }
        authorName: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        isMine: { type: boolean }
    ChallengeChatResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChallengeChatMessage" }
    StridePoolBootstrap:
      type: object
      required: [user, challenges, joinedIds, steps, activities, wallet, profile, membership, healthSources, recoveryCases, stepReviews, freeStreak, pendingInvites]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
        challenges:
          type: array
          items: { $ref: "#/components/schemas/Challenge" }
        joinedIds:
          type: array
          items: { type: string }
        steps: { type: integer }
        activities:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        wallet: { $ref: "#/components/schemas/WalletSummary" }
        profile: { $ref: "#/components/schemas/ProfileSettings" }
        membership: { $ref: "#/components/schemas/MembershipSummary" }
        healthSources:
          type: array
          items: { $ref: "#/components/schemas/HealthSource" }
        recoveryCases:
          type: array
          items: { $ref: "#/components/schemas/RecoveryCase" }
        stepReviews:
          type: array
          items: { $ref: "#/components/schemas/StepReview" }
        freeStreak: { $ref: "#/components/schemas/FreeStreak" }
        pendingInvites:
          type: array
          items: { $ref: "#/components/schemas/PendingInvite" }
    EntryMutationResponse:
      type: object
      required: [joined, wallet]
      properties:
        joined: { type: boolean }
        wallet: { $ref: "#/components/schemas/WalletSummary" }
    CommunityChallengesResponse:
      type: object
      required: [challenges]
      properties:
        challenges:
          type: array
          items: { $ref: "#/components/schemas/Challenge" }
    ChallengeInput:
      type: object
      required: [name, theme, startDate, endDate, days, dailyGoal, challengeType, entryFee, color]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        theme: { type: string, minLength: 1, maxLength: 240 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        days: { type: integer, minimum: 1, maximum: 90 }
        dailyGoal: { type: integer, minimum: 0, maximum: 100000 }
        challengeType: { type: string, enum: [goal, ranking] }
        entryFee: { type: number, minimum: 1, maximum: 500 }
        color: { type: string, minLength: 4, maxLength: 30 }
    MembershipSummary:
      type: object
      required: [plan, status, monthlyPrice, challengeJoinPrice, activeChallengeLimit, activeChallengeCount, challengeCreationLimit, activeCreatedChallengeCount]
      properties:
        plan: { type: string, enum: [free, pro] }
        status: { type: string, enum: [inactive, active, trialing, past_due, canceled] }
        monthlyPrice: { type: number }
        canManageBilling: { type: boolean }
        challengeJoinPrice: { type: number }
        activeChallengeLimit: { type: integer }
        activeChallengeCount: { type: integer }
        challengeCreationLimit: { type: integer }
        activeCreatedChallengeCount: { type: integer }
    ReferralSummary:
      type: object
      required: [code, pendingCount, qualifiedCount, proTrialEndsAt]
      properties:
        code: { type: string }
        pendingCount: { type: integer }
        qualifiedCount: { type: integer }
        proTrialEndsAt: { type: ["string", "null"], format: date-time }
    ReferralPreview:
      type: object
      required: [code, referrerDisplayName]
      properties:
        code: { type: string }
        referrerDisplayName: { type: string }
    ReferralClaimInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 40 }
    ReferralClaimResponse:
      type: object
      required: [claimed, status]
      properties:
        claimed: { type: boolean }
        status: { type: string, enum: [pending, qualified] }
    GroupChallengeInput:
      type: object
      required: [groupName, memberUserIds, name, theme, startDate, endDate, dailyGoal, challengeType, goalType, color]
      properties:
        groupName: { type: string, minLength: 1, maxLength: 80 }
        memberUserIds:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        theme: { type: string, minLength: 1, maxLength: 240 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dailyGoal: { type: integer, minimum: 1, maximum: 100000 }
        challengeType: { type: string, enum: [goal, elimination, ranking] }
        goalType: { type: string, enum: [fixed, personalized] }
        color: { type: string, minLength: 4, maxLength: 30 }
    GroupChallengeResponse:
      type: object
      required: [group, challenge, members]
      properties:
        group:
          $ref: "#/components/schemas/GroupSummary"
        challenge:
          $ref: "#/components/schemas/Challenge"
        members:
          type: array
          items: { $ref: "#/components/schemas/UserSearchResult" }
    GroupSummary:
      type: object
      required: [id, name, ownerUserId, memberCount]
      properties:
        id: { type: string }
        name: { type: string }
        ownerUserId: { type: string }
        memberCount: { type: integer }
    UserSearchResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/UserSearchResult" }
    UserSearchResult:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }
    ChallengeLeaderboardResponse:
      type: object
      required: [challengeId, dailyGoal, days, prizePool, eligibleParticipantCount, disqualifiedCount, leaderboard]
      properties:
        challengeId: { type: string }
        dailyGoal: { type: integer }
        days: { type: integer }
        prizePool: { type: number }
        eligibleParticipantCount: { type: integer }
        disqualifiedCount: { type: integer }
        leaderboard:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardEntry" }
    LeaderboardEntry:
      type: object
      required: [rank, userId, displayName, steps, completedDays, completionPercent, status, isCurrentUser, projectedPayout]
      properties:
        rank: { type: integer }
        userId: { type: string }
        displayName: { type: string }
        steps: { type: integer }
        completedDays: { type: integer }
        completionPercent: { type: integer }
        status: { type: string, enum: [on_track, at_risk, eliminated, finished] }
        isCurrentUser: { type: boolean }
        projectedPayout: { type: number }
    LifetimeLeaderboardResponse:
      type: object
      required: [leaderboard]
      properties:
        leaderboard:
          type: array
          items: { $ref: "#/components/schemas/LifetimeLeaderboardEntry" }
    LifetimeLeaderboardEntry:
      type: object
      required: [rank, userId, displayName, steps, daysLogged, isCurrentUser]
      properties:
        rank: { type: integer }
        userId: { type: string }
        displayName: { type: string }
        steps: { type: integer }
