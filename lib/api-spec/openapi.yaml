        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Challenge operations overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChallengesResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
  /admin/settlements:
    get:
      tags: [admin]
