      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Materialized settlement and refund events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettlementHistoryResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
  /admin/closeout-alerts:
    get:
      tags: [admin]
