openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: stridepool
    description: StridePool persistence and challenge operations.
  - name: compliance
    description: Paid-play eligibility and launch controls
  - name: money
    description: Provider-backed money movement and audit events
  - name: admin
    description: Authenticated internal support and operations tooling
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /compliance/status:
    get:
      operationId: getComplianceStatus
      tags: [compliance]
      summary: Get paid-play launch controls
      description: Returns the server-side controls that must pass before a paid entry can be offered.
      responses:
        "200":
          description: Current compliance controls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceStatus"
  /compliance/eligibility:
    post:
      operationId: checkEligibility
      tags: [compliance]
      summary: Check a participant's paid-play eligibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityInput"
      responses:
        "200":
          description: Eligibility decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityDecision"
        "400":
          description: Invalid eligibility input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /money/checkout:
    post:
      operationId: createCheckout
      tags: [money]
      summary: Create a provider checkout for a paid challenge entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Provider checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "409":
          description: Paid play is unavailable or the request is not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /money/payout-onboarding:
    post:
      operationId: startPayoutOnboarding
      tags: [money]
      summary: Start provider payout onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutOnboardingInput"
      responses:
        "201":
          description: Provider payout onboarding created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutOnboardingResponse"
        "409":
          description: Payout provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /money/payout-account:
    get:
      operationId: getPayoutAccount
      tags: [money]
      summary: Get the current bank payout connection status
      responses:
        "200":
          description: Current payout account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutAccount"
  /money/withdrawal:
    post:
      operationId: createWithdrawal
      tags: [money]
      summary: Withdraw a specified amount from the available wallet balance to the linked bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Withdrawal submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalResponse"
        "409":
          description: Withdrawal requirements are not met
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /paid-play/account:
    get:
      operationId: getPaidPlayAccount
      tags: [compliance]
      summary: Paid Play Terms status for the signed-in account (terms, biometric notice, self-exclusion, entry limit)
      responses:
        "200":
          description: Paid-play account status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaidPlayAccount"
  /paid-play/self-exclusion:
    post:
      operationId: requestPaidPlaySelfExclusion
      tags: [compliance]
      summary: Exclude this account from Paid Challenges for a period or permanently (Paid Play Terms 12.3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfExclusionInput"
      responses:
        "200":
          description: Exclusion applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaidPlayAccount"
  /paid-play/entry-limit:
    put:
      operationId: setPaidPlayEntryLimit
      tags: [compliance]
      summary: Set or clear a weekly paid-entry spending limit (Paid Play Terms 12.3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryLimitInput"
      responses:
        "200":
          description: Limit saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaidPlayAccount"
  /paid-play/biometric-consent:
    post:
      operationId: recordBiometricConsent
      tags: [compliance]
      summary: Record written consent to the biometric notice before identity verification (Paid Play Terms 9.6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricConsentInput"
      responses:
        "200":
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaidPlayAccount"
  /paid-play/account-closure:
    post:
      operationId: closePaidPlayAccount
      tags: [compliance]
      summary: Close the account and pay out the full available balance regardless of the minimum (Paid Play Terms 6.4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountClosureInput"
      responses:
        "200":
          description: Account closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountClosureResult"
        "409":
          description: Closure requirements are not met
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /money/ledger:
    get:
      operationId: getLedger
      tags: [money]
      summary: Get auditable money events
      responses:
        "200":
          description: User money ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stripe/webhook:
    post:
      operationId: receiveStripeWebhook
      tags: [money]
      summary: Receive a signed Stripe event
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeWebhookPayload"
      responses:
        "200":
          description: Stripe event verified and accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid Stripe signature or event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      responses:
        "302":
          description: Redirect after the OIDC callback.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the browser session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /stridepool/bootstrap:
    get:
      tags: [stridepool]
      operationId: getStridePoolBootstrap
      summary: Load public challenges and the current user's persisted state
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: StridePool application state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StridePoolBootstrap"
  /billing/portal:
    post:
      tags: [billing]
      operationId: createMembershipBillingPortal
      summary: Open hosted subscription management for the signed-in member
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "201":
          description: Stripe billing portal session created.
          content:
            application/json:
              schema:
                type: object
                required: [portalUrl]
                properties:
                  portalUrl: { type: string, format: uri }
        "401":
          description: Login required.
        "409":
          description: No manageable subscription or billing is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /billing/pro-checkout:
    post:
      tags: [billing]
      operationId: createProSubscriptionCheckout
      summary: Start the hosted checkout for StridePool Pro
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "201":
          description: Pro subscription checkout created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "401":
          description: Login required.
        "409":
          description: Pro checkout is unavailable or the account is already Pro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stridepool/challenges/{id}/join:
    post:
      tags: [stridepool]
      operationId: joinStridePoolChallenge
      summary: Join a challenge for the authenticated user
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Challenge joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryMutationResponse"
        "401":
          description: Login required for paid or personalized challenges.
  /stridepool/challenges/{id}/leave:
    post:
      tags: [stridepool]
      operationId: leaveStridePoolChallenge
      summary: Leave a challenge for the authenticated user
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Challenge left.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryMutationResponse"
        "401":
          description: Login required.
  /stridepool/community-challenges:
    get:
      tags: [stridepool]
      operationId: getStridePoolCommunityChallenges
      summary: Browse open free community challenges
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Open free community challenges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityChallengesResponse"
  /stridepool/challenges:
    post:
      tags: [stridepool]
      operationId: createStridePoolChallenge
      summary: Create a daily-goal or total-steps podium challenge
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeInput"
      responses:
        "201":
          description: Challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "400":
          description: Invalid challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required.
        "409":
          description: Paid challenge creation is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stridepool/groups/challenges:
    post:
      tags: [stridepool]
      operationId: createStridePoolGroupChallenge
      summary: Legacy free group challenge creation (disabled)
      deprecated: true
      description: Free challenge creation is no longer available. This endpoint always returns 403 and never creates a group or challenge.
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupChallengeInput"
      responses:
        "201":
          description: Legacy response retained for client compatibility; no longer returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupChallengeResponse"
        "400":
          description: Invalid group challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required.
        "403":
          description: Free challenge creation is disabled for all users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: One or more invited walkers could not be found.
  /stridepool/users/search:
    get:
      tags: [stridepool]
      operationId: searchStridePoolUsers
      summary: Search users for a free challenge invite
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Matching users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchResponse"
        "401":
          description: Login required.
  /stridepool/challenges/{id}/leaderboard:
    get:
      tags: [stridepool]
      operationId: getStridePoolChallengeLeaderboard
      summary: Get the free community challenge leaderboard
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Free challenge participant rankings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeLeaderboardResponse"
        "404":
          description: Free community challenge not found.
  /stridepool/challenges/{id}/chat:
    get:
      tags: [stridepool]
      operationId: getStridePoolChallengeChat
      summary: Read recent messages in an active challenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: The latest challenge messages, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeChatResponse"
        "403":
          description: An active participant may read chat only during the challenge dates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Challenge not found.
    post:
      tags: [stridepool]
      operationId: sendStridePoolChallengeChatMessage
      summary: Send a message in an active challenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeChatMessageInput"
      responses:
        "201":
          description: Message sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeChatMessage"
        "400":
          description: Invalid or empty message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: An active participant may send chat only during the challenge dates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Challenge not found.
  /stridepool/lifetime-leaderboard:
    get:
      tags: [stridepool]
      operationId: getStridePoolLifetimeLeaderboard
      summary: Get the free-lane lifetime step leaderboard
      responses:
        "200":
          description: Global ranking of verified free-lane steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifetimeLeaderboardResponse"
  /stridepool/challenges/{id}/invites:
    post:
      tags: [stridepool]
      operationId: createStridePoolChallengeInvite
      summary: Create a shareable or targeted invite for a free community challenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeInviteInput"
      responses:
        "201":
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeInviteResponse"
        "400":
          description: Invalid or non-free challenge invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required.
  /stridepool/invites:
    get:
      tags: [stridepool]
      operationId: getStridePoolPendingInvites
      summary: List pending free challenge invites for the current user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Pending invites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingInvitesResponse"
  /stridepool/notifications:
    get:
      tags: [stridepool]
      operationId: getStridePoolNotifications
      summary: List in-app notifications
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Current user's notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
        "401":
          description: Login required.
  /stridepool/notifications/{id}/read:
    post:
      tags: [stridepool]
      operationId: markStridePoolNotificationRead
      summary: Mark an in-app notification read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Notification marked read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationMutationResponse"
        "401":
          description: Login required.
        "404":
          description: Notification not found.
  /stridepool/notifications/read-all:
    post:
      tags: [stridepool]
      operationId: markAllStridePoolNotificationsRead
      summary: Mark all in-app notifications read
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Notifications marked read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationMutationResponse"
        "401":
          description: Login required.
  /stridepool/invites/{token}:
    get:
      tags: [stridepool]
      operationId: getStridePoolInvite
      summary: Preview a free challenge invite
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 16, maxLength: 120 }
      responses:
        "200":
          description: Invite preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeInvitePreview"
        "404":
          description: Invite not found or no longer available.
  /stridepool/invites/{token}/accept:
    post:
      tags: [stridepool]
      operationId: acceptStridePoolInvite
      summary: Accept a free challenge invite
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 16, maxLength: 120 }
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Invite accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAcceptResponse"
        "401":
          description: Login required.
        "404":
          description: Invite not found or no longer available.
  /stridepool/referrals/me:
    get:
      tags: [stridepool]
      operationId: getStridePoolReferralSummary
      summary: Get the current user's referral code and reward status
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Referral code and reward status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSummary"
        "401":
          description: Login required.
  /stridepool/referrals/{code}:
    get:
      tags: [stridepool]
      operationId: getStridePoolReferralPreview
      summary: Preview a referral link
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, minLength: 6, maxLength: 40 }
      responses:
        "200":
          description: Referral preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralPreview"
        "404":
          description: Referral code not found.
  /stridepool/referrals/claim:
    post:
      tags: [stridepool]
      operationId: claimStridePoolReferral
      summary: Attach a referral code to the current account
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralClaimInput"
      responses:
        "200":
          description: Referral attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralClaimResponse"
        "400":
          description: Referral code cannot be claimed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required.
  /stridepool/sources:
    get:
      tags: [stridepool]
      operationId: getStridePoolHealthSources
      summary: List supported health sources and verification status
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Supported health sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSourcesResponse"
        "401":
          description: Login required.
  /stridepool/sources/{source}/samples:
    post:
      tags: [stridepool]
      operationId: ingestStridePoolSourceSamples
      summary: Store and evaluate normalized step-source samples
      parameters:
        - name: source
