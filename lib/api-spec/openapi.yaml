          description: Invalid decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
        "404":
          description: Source sample not found.
        "409":
          description: Source sample was already decided.
  /admin/recovery-cases:
    get:
      tags: [admin]
      operationId: getAdminRecoveryCases
      summary: List pending recovery cases
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
