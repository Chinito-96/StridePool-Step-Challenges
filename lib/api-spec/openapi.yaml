openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: stridepool
    description: StridePool persistence and challenge operations.
  - name: compliance
    description: Paid-play eligibility and launch controls
  - name: money
    description: Provider-backed money movement and audit events
  - name: admin
    description: Authenticated internal support and operations tooling
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /compliance/status:
    get:
      operationId: getComplianceStatus
      tags: [compliance]
      summary: Get paid-play launch controls
      description: Returns the server-side controls that must pass before a paid entry can be offered.
      responses:
        "200":
          description: Current compliance controls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceStatus"
  /compliance/eligibility:
    post:
      operationId: checkEligibility
      tags: [compliance]
      summary: Check a participant's paid-play eligibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityInput"
      responses:
        "200":
          description: Eligibility decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityDecision"
        "400":
          description: Invalid eligibility input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /money/checkout:
    post:
      operationId: createCheckout
      tags: [money]
      summary: Create a provider checkout for a paid challenge entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Provider checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "409":
          description: Paid play is unavailable or the request is not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /money/payout-onboarding:
    post:
      operationId: startPayoutOnboarding
      tags: [money]
      summary: Start provider payout onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutOnboardingInput"
      responses:
        "201":
          description: Provider payout onboarding created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutOnboardingResponse"
        "409":
          description: Payout provider is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /money/ledger:
    get:
      operationId: getLedger
      tags: [money]
      summary: Get auditable money events
      responses:
        "200":
          description: User money ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stripe/webhook:
    post:
      operationId: receiveStripeWebhook
      tags: [money]
      summary: Receive a signed Stripe event
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeWebhookPayload"
      responses:
        "200":
          description: Stripe event verified and accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid Stripe signature or event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      responses:
        "302":
          description: Redirect after the OIDC callback.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the browser session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /stridepool/bootstrap:
    get:
      tags: [stridepool]
      operationId: getStridePoolBootstrap
      summary: Load public challenges and the current user's persisted state
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: StridePool application state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StridePoolBootstrap"
  /stridepool/challenges/{id}/join:
    post:
      tags: [stridepool]
      operationId: joinStridePoolChallenge
      summary: Join a challenge for the authenticated user
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Challenge joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryMutationResponse"
        "401":
          description: Login required for paid or personalized challenges.
  /stridepool/challenges/{id}/leave:
    post:
      tags: [stridepool]
      operationId: leaveStridePoolChallenge
      summary: Leave a challenge for the authenticated user
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Challenge left.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryMutationResponse"
        "401":
          description: Login required.
  /stridepool/community-challenges:
    get:
      tags: [stridepool]
      operationId: getStridePoolCommunityChallenges
      summary: Browse open free community challenges
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Open free community challenges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityChallengesResponse"
  /stridepool/challenges:
    post:
      tags: [stridepool]
      operationId: createStridePoolChallenge
      summary: Create a total-steps podium challenge
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeInput"
      responses:
        "201":
          description: Ranking challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "400":
          description: Invalid challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required.
        "409":
          description: Paid challenge creation is not available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stridepool/groups/challenges:
    post:
      tags: [stridepool]
      operationId: createStridePoolGroupChallenge
      summary: Create a private free group challenge
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupChallengeInput"
      responses:
        "201":
          description: Private group and challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupChallengeResponse"
        "400":
          description: Invalid group challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required.
        "404":
          description: One or more invited walkers could not be found.
  /stridepool/users/search:
    get:
      tags: [stridepool]
      operationId: searchStridePoolUsers
      summary: Search users for a free challenge invite
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Matching users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchResponse"
        "401":
          description: Login required.
  /stridepool/challenges/{id}/leaderboard:
    get:
      tags: [stridepool]
      operationId: getStridePoolChallengeLeaderboard
      summary: Get the free community challenge leaderboard
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Free challenge participant rankings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeLeaderboardResponse"
        "404":
          description: Free community challenge not found.
  /stridepool/lifetime-leaderboard:
    get:
      tags: [stridepool]
      operationId: getStridePoolLifetimeLeaderboard
      summary: Get the free-lane lifetime step leaderboard
      responses:
        "200":
          description: Global ranking of verified free-lane steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifetimeLeaderboardResponse"
  /stridepool/challenges/{id}/invites:
    post:
      tags: [stridepool]
      operationId: createStridePoolChallengeInvite
      summary: Create a shareable or targeted invite for a free community challenge
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeInviteInput"
      responses:
        "201":
          description: Invite created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeInviteResponse"
        "400":
          description: Invalid or non-free challenge invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required.
  /stridepool/invites:
    get:
      tags: [stridepool]
      operationId: getStridePoolPendingInvites
      summary: List pending free challenge invites for the current user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Pending invites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingInvitesResponse"
  /stridepool/notifications:
    get:
      tags: [stridepool]
      operationId: getStridePoolNotifications
      summary: List in-app notifications
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Current user's notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
        "401":
          description: Login required.
  /stridepool/notifications/{id}/read:
    post:
      tags: [stridepool]
      operationId: markStridePoolNotificationRead
      summary: Mark an in-app notification read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Notification marked read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationMutationResponse"
        "401":
          description: Login required.
        "404":
          description: Notification not found.
  /stridepool/notifications/read-all:
    post:
      tags: [stridepool]
      operationId: markAllStridePoolNotificationsRead
      summary: Mark all in-app notifications read
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Notifications marked read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationMutationResponse"
        "401":
          description: Login required.
  /stridepool/invites/{token}:
    get:
      tags: [stridepool]
      operationId: getStridePoolInvite
      summary: Preview a free challenge invite
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 16, maxLength: 120 }
      responses:
        "200":
          description: Invite preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeInvitePreview"
        "404":
          description: Invite not found or no longer available.
  /stridepool/invites/{token}/accept:
    post:
      tags: [stridepool]
      operationId: acceptStridePoolInvite
      summary: Accept a free challenge invite
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 16, maxLength: 120 }
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Invite accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAcceptResponse"
        "401":
          description: Login required.
        "404":
          description: Invite not found or no longer available.
  /stridepool/sync:
    post:
      tags: [stridepool]
      operationId: syncStridePoolSteps
      summary: Sync a daily step total for the authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncStepsBody"
      responses:
        "200":
          description: Steps synchronized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStepsResponse"
        "401":
          description: Login required.
  /stridepool/sources:
    get:
      tags: [stridepool]
      operationId: getStridePoolHealthSources
      summary: List supported health sources and verification status
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Supported health sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSourcesResponse"
        "401":
          description: Login required.
  /stridepool/sources/{source}/samples:
    post:
      tags: [stridepool]
      operationId: ingestStridePoolSourceSamples
      summary: Store and evaluate normalized step-source samples
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [demo, manual, csv_import, apple_health, health_connect]
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestStepSamplesBody"
      responses:
        "200":
          description: Samples stored and evaluated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestStepSamplesResponse"
        "400":
          description: Invalid source sample payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required.
  /stridepool/recovery:
    get:
      tags: [stridepool]
      operationId: getStridePoolRecoveryCases
      summary: List recovery and settlement states
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Recovery cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCasesResponse"
        "401":
          description: Login required.
    post:
      tags: [stridepool]
      operationId: requestStridePoolRecovery
      summary: Request a grace day, injury pause, or support review
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryRequestBody"
      responses:
        "201":
          description: Recovery request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCase"
        "400":
          description: Invalid recovery request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required.
        "404":
          description: Challenge not found or not joined.
  /stridepool/wallet/demo-funds:
    post:
      tags: [stridepool]
      operationId: addStridePoolDemoFunds
      summary: Add demo wallet funds for an authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Wallet updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSummary"
        "401":
          description: Login required.
  /stridepool/profile:
    patch:
      tags: [stridepool]
      operationId: updateStridePoolProfile
      summary: Update persisted StridePool profile settings
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSettings"
        "401":
          description: Login required.
  /admin/flagged-step-records:
    get:
      tags: [admin]
      operationId: getAdminFlaggedStepRecords
      summary: List suspicious daily step records
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Daily records held for anti-cheat review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlaggedStepRecordsResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
  /admin/challenges:
    get:
      tags: [admin]
      operationId: getAdminChallenges
      summary: List challenge status and pool totals
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Challenge operations overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChallengesResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
  /admin/settlements:
    get:
      tags: [admin]
      operationId: getAdminSettlementHistory
      summary: List challenge settlement history
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Materialized settlement and refund events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettlementHistoryResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
  /admin/users/search:
    get:
      tags: [admin]
      operationId: searchAdminUsers
      summary: Search users by email, ID, or name
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Matching users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserSearchResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
  /admin/users/{id}:
    get:
      tags: [admin]
      operationId: getAdminUser
      summary: Inspect a user's wallet and challenge history
      parameters:
        - $ref: "#/components/parameters/ChallengeId"
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: User support detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
        "404":
          description: User not found.
  /admin/challenges/{challengeId}/participants/{userId}/override:
    post:
      tags: [admin]
      operationId: overrideAdminChallengeParticipant
      summary: Override a free challenge participant status
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminParticipantOverrideBody"
      responses:
        "200":
          description: Participant status override recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminParticipantOverrideResponse"
        "400":
          description: Invalid override or paid challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login required.
        "403":
          description: Admin access required.
        "404":
          description: Challenge or participant not found.
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema:
        type: string
    ChallengeId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
